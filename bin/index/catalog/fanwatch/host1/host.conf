# host1 settings for fanwatch-helper.service (installed as /etc/systemd/system/fanwatch-helper.service.d/host.conf)
[Service]
Environment=FANWATCH_VOLUME=/home/user1/backups
Environment=FANWATCH_SKIP_UNDER=
Environment=FANWATCH_ONLY=/home/user1/backups/office:/home/user1/backups/software
Environment=FANWATCH_CANARY_DIR=/home/user1/backups
