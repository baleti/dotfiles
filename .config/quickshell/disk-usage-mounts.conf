# Mounts shown in the bar's disk panel (mod+d) usage subsection, and as
# candidates for the pill's root-% readout. One entry per line, in the
# order you want them displayed.
#
# Each entry is either:
#   - a mount path, as it appears in `df`'s "Mounted on" column (e.g. /,
#     /home, /boot/efi)
#   - an rclone/sshfs remote name, as it appears in `df`'s "Filesystem"
#     column, trailing colon included (e.g. gdrive:, notes:)
#
# Blank lines and lines starting with # are ignored. Run `df --output=source,target`
# to see the exact names available on this machine.

