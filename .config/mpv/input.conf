l seek 5
h seek -5
j seek -60
k seek 60
S cycle sub
Shift+del run "/bin/sh" "-c" "rm '${path}'"
H seek 0 absolute
o cycle-values osd-duration 3600000 100; show-progress
B playlist-play-index 0
g-g playlist-play-index 0

# middle-button drag pans a zoomed-in image (borrowed from zathura; uses the built-in positioning script, Ctrl+left-drag still works)
MBTN_MID script-binding positioning/drag-to-pan

# a: reset zoom, panscan, pan and alignment, same as Alt+Backspace (borrowed from zathura, where a re-fits the page)
a no-osd set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0

# mouse wheel no longer changes volume (default binding); 9/0 still do
WHEEL_UP ignore
WHEEL_DOWN ignore

# zoom keys: same as the defaults but no-osd, so the "Zoom: ..." overlay stays hidden (other OSD messages unaffected)
Alt++ no-osd add video-zoom 0.1
ZOOMIN no-osd add video-zoom 0.1
Alt+- no-osd add video-zoom -0.1
ZOOMOUT no-osd add video-zoom -0.1
Alt+KP_ADD no-osd add video-zoom 0.1
Alt+KP_SUBTRACT no-osd add video-zoom -0.1
Alt+BS no-osd set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0
KP1 no-osd add video-zoom -0.01
KP9 no-osd add video-zoom 0.01

# Ctrl+wheel: cursor-centric zoom via scripts/quiet-zoom.lua (the built-in positioning script always shows the OSD, and no-osd can't suppress it)
Ctrl+WHEEL_UP script-binding quiet-zoom/in
Ctrl+WHEEL_DOWN script-binding quiet-zoom/out
