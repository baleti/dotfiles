# Bluetooth address of the headphones used by mod+b (connect) and
# mod+ctrl+b (disconnect). Find yours with `bluetoothctl devices`.
# Read by scripts/headphones.sh (plain KEY=VALUE, sourced by bash).
HEADPHONES_ID=B0:F0:0C:0E:77:29

# Phone (Android, reached over WireGuard) that may be holding the headphones.
# mod+b makes it release them (via adb) before connecting here; mod+ctrl+b hands them
# back to it after disconnecting here. Needs this host paired once (`adb pair`);
# the Companion app turns Wireless debugging on/off as needed. Empty = skip the phone step.
PHONE_HOST=10.10.0.5
