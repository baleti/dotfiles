[package]
name = "notifyd"
version = "0.1.0"
edition = "2021"

[dependencies]
gio = "0.18"
glib = "0.18"
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "notifyd"
path = "src/main.rs"

[[bin]]
name = "notifyctl"
path = "src/bin/notifyctl.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
