[package]
name = "notifyd"
version = "0.2.0"
edition = "2021"

# Headless as of 2026-08-30: the GTK popup layer (src/popup.rs) was replaced
# by quickshell rendering (~/.config/quickshell/notifications/). notifyd
# still owns org.freedesktop.Notifications and does all the tracking /
# timeout / action-routing exactly as before -- it just writes the current
# popup set to ~/.cache/notifyd/state.json for quickshell to draw, instead
# of drawing it itself. gio/glib stay for the D-Bus server + main loop +
# timers; png is for decoding image-data hints to a file quickshell can load.
[dependencies]
gio = "0.18"
glib = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
png = "0.17"

[[bin]]
name = "notifyd"
path = "src/main.rs"

[[bin]]
name = "notifyctl"
path = "src/bin/notifyctl.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
