[package]
name = "winswitch"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
memmap2 = "0.9"
bitflags = "2"
gbm = { version = "0.18", default-features = false }
png = "0.18.1"

[[bin]]
name = "winswitch"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
