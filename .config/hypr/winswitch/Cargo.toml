[package]
name = "winswitch"
version = "0.1.0"
edition = "2021"

[dependencies]
gio = "0.18"
glib = "0.18"
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
memmap2 = "0.9"
bitflags = "2"

[[bin]]
name = "winswitch"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
