[package]
name = "launcher-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay-client-toolkit = "0.20"
tiny-skia = "0.11"
ab_glyph = "0.2"
png = "0.18"
serde_json = "1"
pickerdsl = { path = "../../dsl/rs" }
resvg = "0.48.1"

[[bin]]
name = "launcher-ui"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
