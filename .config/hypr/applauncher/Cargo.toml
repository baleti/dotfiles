[package]
name = "applauncher"
version = "0.1.0"
edition = "2021"

# A standalone Rust replacement for the quickshell app launcher
# (~/.config/quickshell/launcher/). Same look -- centred card, 1px accent
# border, icon + name rows, the shared /verb query DSL -- but a resident
# GTK3 + wlr-layer-shell daemon instead of a surface inside the quickshell
# process, so opening it is a socket message and an opacity flip, not a
# property change fighting the bar's per-second graph repaints for the one
# QML thread. Follows the same crate shape as ../winswitch and
# ../clipboard-picker (GTK3, gtk-layer-shell, scheme.json theming). The DSL
# module is vendored from clipboard-picker's picker.rs rather than shared
# (this repo keeps one copy per picker -- see ~/.config/docs/query-dsl.md).

[dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
gdk-pixbuf = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
