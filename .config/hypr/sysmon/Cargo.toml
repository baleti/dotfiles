[package]
name = "sysmon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sysmond"
path = "src/bin/sysmond.rs"

[[bin]]
name = "sysmon-graph"
path = "src/bin/sysmon-graph.rs"

[dependencies]
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
cairo-rs = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
