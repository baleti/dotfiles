setw -g mode-keys vi

# scrollback size
set -g history-limit 1000000

# remap prefix from 'C-b' to 'C-x'
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

#remap scrolling mode (copy mode)
#https://unix.stackexchange.com/questions/450184/in-tmux-how-to-set-shortcut-for-copy-mode
bind-key -T prefix 'u' copy-mode
bind-key -T prefix 'C-u' copy-mode

# toggle back and forth between the current and last-used window
bind-key -T prefix Tab last-window

# https://superuser.com/questions/1630799/how-to-scroll-two-panes-in-sync-in-tmux
# couldn't find a way to send to all visible panes, so copied command to 4
bind-key -T copy-mode-vi C-M-u send-keys -t 0 -X halfpage-up\; send-keys -t 1 -X halfpage-up\; send-keys -t 2 -X halfpage-up\; send-keys -t 3 -X halfpage-up
bind-key -T copy-mode-vi C-M-d send-keys -t 0 -X halfpage-down\; send-keys -t 1 -X halfpage-down\; send-keys -t 2 -X halfpage-down\; send-keys -t 3 -X halfpage-down
bind-key -n C-M-u copy-mode\; copy-mode -t 0\; copy-mode -t 1\; copy-mode -t 2\; copy-mode -t 3

# move the current window into a brand-new session in one step, no prompt.
# prefix+. is left alone for moving into a session that already exists.
# logic lives in move-window-new-session.sh (naming/collision-avoidance,
# the last-window refusal, and why #{client_tty} must come from the
# keypress itself rather than an external `-t <pane>` test call, are all
# explained there) - #{...} tokens here are outer-expanded by run-shell's
# own FORMATS pass before /bin/sh ever sees them, so the script just
# receives literal values as argv, describing the window/session/client
# that pressed the key.
bind-key -T prefix C-. run-shell "~/.config/tmux/scripts/move-window-new-session.sh '#{window_id}' '#{session_name}' '#{window_name}' '#{client_tty}' '#{session_windows}'"
# https://unix.stackexchange.com/questions/567958/how-to-switch-panes-in-tmux-and-then-begin-typing-immediately
# lets you type immediately after switching panes
bind-key -T prefix Right select-pane -R
bind-key -T prefix Left select-pane -L
bind-key -T prefix Up select-pane -U
bind-key -T prefix Down select-pane -D
bind-key -T prefix l select-pane -R
bind-key -T prefix h select-pane -L
bind-key -T prefix k select-pane -U
bind-key -T prefix j select-pane -D

# Set new panes to open in current directory
# https://gist.github.com/william8th/faf23d311fc842be698a1d80737d9631
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on
# https://github.com/microsoft/WSL/issues/5931
set -sg escape-time 1

#clear scrollback history + screen (frees plain C-l for other use)
bind-key -T prefix C-l send-keys C-l \; run-shell 'sleep 0.1' \; clear-history

# When killing session move to the next opened session
# https://unix.stackexchange.com/questions/58588/kill-a-tmux-session-and-select-another-tmux-session
bind-key x confirm-before -p "kill session #S? (y/n)" "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'"

# don't exit copy mode when yanking
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Enter send -X copy-selection

# tmux-resurrect / tmux-continuum, installed without TPM
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
# set -g @continuum-boot 'on'

# pane_contents.tar.gz is a single fixed file that save.sh overwrites every
# cycle (see helpers.sh: pane_contents_archive_file()) - at a 10-minute
# continuum interval, scrollback from more than ~10 minutes ago is already
# gone. This hook (execute_hook "post-save-all" in save.sh, fired after the
# archive is rewritten each cycle) keeps a thinned timestamped history of it
# instead; see the script for the retention scheme.
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/resurrect-rotate-pane-contents.sh'

# self-healing tmux-resurrect/tmux-continuum checkout, no TPM required:
# clone each plugin on first run, then refresh at most once every 30 days
# via a backgrounded git pull so tmux server startup never blocks on git
run-shell '\
  d=~/.config/tmux/plugins; \
  for r in tmux-resurrect tmux-continuum; do \
    e="${r#tmux-}.tmux"; \
    [ -f "$d/$r/$e" ] || git clone --quiet --depth 1 "https://github.com/tmux-plugins/$r" "$d/$r"; \
    f="$d/$r/.git/FETCH_HEAD"; \
    m=$(stat -c %Y "$f" 2>/dev/null || echo 0); \
    if [ $(( $(date +%s) - m )) -gt 2592000 ]; then touch "$f" 2>/dev/null; git -C "$d/$r" pull --quiet >/dev/null 2>&1 & fi; \
  done'
run '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# override tmux-resurrect's own prefix+C-r binding (set by resurrect.tmux's
# set_restore_bindings, which runs above and so loses to whatever binds C-r
# afterward - same "later line wins" trick as prefix+w's override): its
# restore.sh always restores from two fixed locations with no way to pick an
# older one. resurrect-restore.sh fzf-lists the timestamped pane_contents
# history that resurrect-rotate-pane-contents.sh maintains, lets one be
# chosen, then hands off to the real restore.sh.
#
# Deliberately run-shell -b straight to resurrect-restore.sh, NOT wrapped in
# an outer display-popup like prefix+C-w: restore.sh's own switch-client
# call needs a plain (non-popup) run-shell context to resolve the right
# client, so the picker popup has to be opened *by* that script, not around
# it - see resurrect-restore.sh's comment for the full reasoning. #{client_tty}
# bridging is still needed (same reason as prefix+C-w), just passed as an
# argument instead of baked into an outer popup command.
bind-key -T prefix C-r \
  display-popup -C \; \
  run-shell -b "~/.config/tmux/scripts/resurrect-restore.sh '#{client_tty}'"

# enable OSC 52 passthrough so ssh remote tmux copy-mode can write to local clipboard
set -s set-clipboard on

# full-text window switcher: choose-tree's own tree-mode isn't a
# rebindable key table (only copy-mode is), so this can't be wired up as
# a key inside prefix+w's tree view - it lives on its own binding instead.
# live fzf popup that ranks pane scrollback by BM25 + recency, see
# ~/.config/tmux/scripts/window-search.py for the ranking approach.
#
# -C first: "if the command is run inside an existing popup, that popup is
# modified [instead of starting fresh]" (tmux(1)) - any popup left over from
# an interrupted prior run (killed client, crashed script, etc.) would
# otherwise silently eat this keypress instead of opening a real one. -C
# force-closes whatever's there (a no-op if nothing is), then the second
# display-popup always starts genuinely fresh.
# -EE (not -E): only auto-close on a clean exit, so a failure - e.g. the
# switch-client verification in the script - stays on screen to be read
# instead of vanishing before it can be seen.
#
# The client that pressed this key has to reach the script somehow, so it
# can switch-client back to the right one when you select something -
# display-popup's own shell-command is passed to /bin/sh completely
# unexpanded (confirmed against tmux(1): run-shell's docs explicitly say
# "shell-command is expanded using the rules in FORMATS"; display-popup's
# entry has no such sentence, and testing confirms it: a #{client_tty} put
# directly in display-popup's shell-command arrived at the script as the
# literal 13 characters, not a real tty path - that was the actual bug
# behind switch-client silently going nowhere).
# run-shell's shell-command IS expanded, so the whole display-popup command
# line is built *inside* a run-shell: by the time tmux hands it to /bin/sh,
# #{client_tty} has already become a real tty path, and the popup receives
# it as a literal --client argument that needs no further expansion.
#
# This used to stash the tty in a *global* tmux environment variable for the
# script to read back instead. That worked but was racy: the variable is not
# scoped to an invocation, so two clients pressing prefix+C-w within the
# ~50ms the script takes to start would have the second overwrite the
# first's tty - client A's popup would then switch *B's* terminal to A's
# selection, and B's own popup would find the variable already consumed.
# Interpolating per-invocation shares nothing, so there is nothing to race.
#
# -b so the popup (which blocks for as long as it is open) doesn't stall
# tmux's command queue - without -b, run-shell holds the queue until the
# shell command finishes, per tmux(1).
# The -C stays a plain tmux command rather than joining the run-shell: it
# needs no format expansion, and folding it in would need a ';' inside the
# run-shell string, which tmux unescapes on load and /bin/sh then eats as a
# command separator - the second display-popup would run as a shell command
# and silently not exist.
bind-key -T prefix C-w \
  display-popup -C \; \
  run-shell -b "tmux display-popup -c '#{client_tty}' -w 98% -h 96% -EE '~/.config/tmux/scripts/window-search.py --client #{client_tty}'"

# move the current window into a brand-new session in one step, no prompt -
# the session gets tmux's own auto-assigned name, same as the bare `tmux
# new-session` in .zshrc that starts every top-level session (no -s there
# either). prefix+. is left alone for moving into a session that already
# exists.
#
# #{window_id}/#{session_windows}/#{session_name}/#{window_name}/
# #{client_tty} (outer, unescaped) are expanded by run-shell's own FORMATS
# pass before the string reaches /bin/sh, so they're already literal
# values (e.g. @170) describing the window and client that pressed the
# key - regardless of which client/session is doing the pressing. This
# only holds because the key press itself supplies that context; do NOT
# reproduce this command via `tmux run-shell ... -t <pane>` from a plain
# shell to test it - a pane target does not reliably supply a *client*
# context for #{client_tty} the way an actual keypress does, and it can
# resolve to some other, unrelated attached client instead (confirmed the
# hard way).
#
# If the window being moved is the last one in its session, refuse
# outright: moving it would empty and destroy that session, and with
# detach-on-destroy on (the default, unchanged here) that silently
# detaches the client - same surprise this file's own `bind-key x`
# (kill-session) already routes around, just with no way to route around
# it here since destroying the session is *the entire point* of a bare
# move in that case. Better to do nothing and say so.
#
# ##{session_name}/##{window_id} (doubled #) survive the outer pass as a
# literal "#{session_name} #{window_id}" text, to be expanded instead by
# the nested `tmux new-session -P -F` once IT runs and knows the new
# session's actual name and its own placeholder window's id.
# `new-session -d` always creates one placeholder window of its own -
# `set --`/$1/$2 (POSIX, no bashisms, since this runs under /bin/sh) pulls
# the captured name/id apart so the placeholder can be killed right after
# the real window is moved in, leaving the new session with only that one
# window. The final switch-client makes the pressing client follow the
# window into its new session, rather than being left looking at whatever
# window is now current in the old one.
bind-key -T prefix C-. run-shell "if [ #{session_windows} -eq 1 ]; then tmux display-message -c '#{client_tty}' 'refusing to move window #{window_id} (#{window_name}): it is the only window in session #{session_name} - moving it would destroy the session, so nothing happened'; else out=\"\$(tmux new-session -d -P -F '##{session_name} ##{window_id}')\"; set -- \$out; tmux move-window -s #{window_id} -t \"\$1:\"; tmux kill-window -t \"\$2\"; tmux switch-client -c '#{client_tty}' -t \"\$1:\"; fi"
